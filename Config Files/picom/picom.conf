#################################
#             Sombras           #
#################################
shadow = false;

#################################
#         Desvanecimiento       #
#################################
fading = true;
fade-in-step = 0.2;
fade-out-step = 0.05;

#################################
#   Transparencia / Opacidad    #
#################################
inactive-opacity = 0.85;
frame-opacity = 0.88;
active-opacity = 1;
inactive-opacity-override = false;

#################################
#           EXCLUSIONES         #
#################################

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
];

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g = 'Conky'"
];

opacity-rule = [
  "100:class_g = 'Conky'",
  "100:class_g = 'i3lock'",
  "100:name = 'betterlockscreen'",
  "100:class_g = 'vlc'"
];

focus-exclude = [ 
  "class_g = 'Cairo-clock'" ];

#################################
#       Configuración General   #
#################################
backend = "xrender";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = false;
use-damage = true;
log-level = "warn";
corner-radius = 10.0;

wintypes:
{
  tooltip = { fade = true shadow = true opacity = 0.75 focus = true full-shadow = false }
  dock = { shadow = false }
  dnd = { shadow = false }
  popup_menu = { opacity = 0.95 }
  dropdown_menu = { opacity = 0.95 }
}