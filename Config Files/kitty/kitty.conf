# ==========================================================
# 󰄛 CONFIGURACIÓN BÁSICA & FUENTES
# ==========================================================
font_family          JetBrainsMono Nerd Font
font_size            10
cursor_shape         beam
cursor_stop_blinking_after 0.5
scrollback_lines     10000
sync_to_monitor      yes
repaint_delay        10
open_url_with        default
mouse_hide_wait      1.0

# ==========================================================
# 󰏘 ESTÉTICA & COLORES
# ==========================================================
foreground           #f0f0f0
background           #111827
selection_foreground #111827
selection_background #f42841
cursor               #f42841

# Paleta de colores
color0  #111827
color8  #9ca3af
color1  #f42841
color9  #ff6b7a
color2  #10b981
color10 #00ff41
color3  #ffcc00
color11 #bfff00
color4  #3b82f6
color12 #00bfff
color5  #8b5cf6
color13 #ff1493
color6  #06b6d4
color14 #ff8f4a
color7  #f9fafb
color15 #f0f0f0

# Imagen de fondo y sonido
background_image        ~/.config/kitty/kittywall.png
bell_path               ~/.config/kitty/ding.ogg
visual_bell_duration 0.1
visual_bell_color #00D0FF
background_image_layout cscaled
background_tint         0.0
background_tint_gaps    1.0

# ==========================================================
# 󰖰 VENTANAS (WINDOWS) & DISEÑO
# ==========================================================
enabled_layouts      splits, stack, grid, fat, tall
window_padding_width 0 5 0 5
window_margin_width  0
window_border_width  1pt
active_border_color  #f42841
inactive_border_color #2d3748
draw_minimal_borders yes
resize_debounce_time 0.1

# ==========================================================
# 󰓩 BARRA DE PESTAÑAS (TAB BAR)
# ==========================================================
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_margin_height       5.0 0.0

active_tab_foreground       #111827
active_tab_background       #f42841
active_tab_font_style       bold
inactive_tab_foreground     #9ca3af
inactive_tab_background     #1b2433

# --- TAB BAR TITLES ---
# Pestañas inactivas:
tab_title_template          " ○ 󰆍 "

# Pestaña activa
active_tab_title_template   " ● 󰆍 {title.split('/')[-1]} "

# Estilos
active_tab_font_style       bold
inactive_tab_font_style     normal

# ==========================================================
# 󰌌 ATAJOS DE TECLADO (KEYBINDINGS)
# ==========================================================

# --- Navegación ---
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+,      previous_tab
map ctrl+shift+.      next_tab

# --- Gestión de Ventanas ---
map ctrl+shift+enter     launch --location=hsplit
map ctrl+shift+backspace launch --location=vsplit
map ctrl+shift+w         close_window
map ctrl+shift+p         move_window_forward
map ctrl+shift+o         move_window_backward

# --- Redimensionar ---
map ctrl+shift+alt+left  resize_window narrower 2
map ctrl+shift+alt+right resize_window wider 2
map ctrl+shift+alt+up    resize_window taller 2
map ctrl+shift+alt+down  resize_window shorter 2
map ctrl+shift+alt+r     resize_window reset

# --- Limpieza de Atajos por Defecto ---
map ctrl+shift+b no_op
map ctrl+shift+f no_op
map ctrl+shift+r no_op