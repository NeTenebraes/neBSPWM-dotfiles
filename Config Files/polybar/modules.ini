;; --- Definiciones de Módulos ---

[module/tray]
type = internal/tray
tray-size = 16
tray-padding = 3
format-padding = 0
format-margin = 0

; Colores heredados pero explícitos para el tray
background = ${color.bg}
foreground = ${color.white}

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/GMTime.sh
interval = 1

format = <label>
format-foreground = ${color.white}
label-font = 1

; Click izquierdo: alterna modo
click-left = ~/.config/polybar/scripts/GMTime.sh --toggle &


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sep]
type = custom/text
content = "|"
content-font = 1
content-foreground = #ffffff
content-background = #000000

format-padding = 0
format-margin = 0


[module/sep2]
type = custom/text
content = " "
content-font = 1
content-foreground = #00ff00
content-background = #000000


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_ 
[module/workspaces]
type = internal/bspwm

pin-workspaces = true
enable-click = true
enable-scroll = true

label-active-font = 2
label-occupied-font = 2 
label-urgent-font = 2
label-empty-font = 2

format = <label-state>
label-active = ◈
label-active-foreground = ${color.reshade2}
label-active-background = ${color.bg}
label-occupied = ◆
label-occupied-foreground = ${color.greshade3}
label-occupied-background = ${color.bg}
label-urgent = ❖
label-urgent-foreground = ${color.ac}
label-urgent-background = ${color.bg}
label-empty = ◇
label-empty-foreground = ${color.greshade2}
label-empty-background = ${color.bg}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
[module/network-cycle]
type = custom/ipc

hook-0 = ~/.config/polybar/scripts/net_info.sh
initial = 1

format = <label>
label = %output%
format-foreground = #ffffff
format-background = #000000

click-left  = ~/.config/polybar/scripts/net_info.sh prev
click-right = ~/.config/polybar/scripts/net_info.sh next


[module/powermenu]
type = custom/script
exec = ~/.config/polybar/scripts/powermenu_toggle.sh status
interval = 1
tail = false

click-left = ~/.config/polybar/scripts/powermenu_toggle.sh click

[module/audio]
type = custom/ipc

; El comando que se ejecuta para mostrar el texto
hook-0 = ~/.config/polybar/scripts/Audio.sh

; Se ejecuta al iniciar la barra
initial = 1

format = <label>
label = %output%
format-foreground = ${color.white}
label-font = 1

; Click/scroll: Cambian volumen + envían señal de refresco instantáneo
click-left  = ~/.config/polybar/scripts/Audio.sh --toggle-mute && polybar-msg action "#audio.hook.0"
scroll-up   = ~/.config/polybar/scripts/Audio.sh --inc         && polybar-msg action "#audio.hook.0"
scroll-down = ~/.config/polybar/scripts/Audio.sh --dec         && polybar-msg action "#audio.hook.0"

[module/security]
type = custom/script
exec = ~/.config/polybar/scripts/security.sh
interval = 5

format = <label>
format-background = ${color.background}
label = %output%
label-font = 4

click-left = ~/.config/polybar/scripts/security.sh --notify-all
click-right = ~/.config/polybar/scripts/security.sh --notify-all

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 3
click-left = ~/.config/polybar/scripts/battery.sh --notify

format-padding = 0
format-margin = 0
format-background = ${color.background}


[module/active_window]
type = custom/script
exec = ~/.config/polybar/scripts/active_window.sh
interval = 1

; Estilos
format = <label>
format-background = ${color.background}
format-foreground = #ffffff
format-padding = 1

label = %output%
; Animación sutil cuando cambias de ventana
label-underline = #ff4444