name: Update neBSPWM News
on:
  schedule:
    - cron: '*/30 * * * *' # Cada 30 mins
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # Filtro
          # Buscamos 'bspwn' o 'nebspwm' en título y descripción.
          item_exec: |
            const content = (post.title + post.description).toLowerCase();
            if (content.indexOf('bspwn') === -1 && content.indexOf('nebspwm') === -1) {
              return null;
            }
            return post;

          # TEMPLATE HTML
          template: "<tr><td>$date</td><td><a href='$url'>$title</a></td></tr>"
          date_format: "dd/mm/yyyy"
