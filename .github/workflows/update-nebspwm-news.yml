name: Update neBSPWM News
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # FILTRO DEFINITIVO SIN 'RETURN'
          # Explicación: Si (titulo + descripcion) incluye 'bspwm', mantiene el post. 
          # Si no, lo convierte en null (lo que hace que la acción lo ignore).
          item_exec: "(post.title + post.description).toLowerCase().includes('nebspwm') ? post : null"

          # TEMPLATE HTML
          template: "<tr><td>$date</td><td><a href='$url'>$title</a></td></tr>"
          date_format: "dd/mm/yyyy"
          
          # Configuración de commit
          commit_message: "Updated with filtered neBSPWM posts"
          committer_username: "blog-post-bot"
          committer_email: "blog-post-bot@example.com"
