name: Update neBSPWM News
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # FILTRO Y LIMPIEZA EN UNA LÍNEA (EVITA SYNTAXERROR)
          # 1. Quitamos el HTML: .replace(/<[^>]*>/g, '')
          # 2. Verificamos si incluye 'bspwm'
          # 3. Si pasa, asignamos el texto limpio a la descripción y devolvemos el post
          item_exec: "post.description.replace(/<[^>]*>/g, '').toLowerCase().includes('bspwm') ? (post.description = post.description.replace(/<[^>]*>/g, ''), post) : null"

          # TEMPLATE USANDO LA DESCRIPCIÓN YA LIMPIA
          template: "<tr><td>$date</td><td><a href='$url'>$description</a></td></tr>"
          date_format: "dd/mm/yyyy"
          
          commit_message: "Bot: Update neBSPWM news (Clean Description)"
          committer_username: "blog-post-bot"
          committer_email: "blog-post-bot@example.com"
