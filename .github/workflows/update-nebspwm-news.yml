name: Update neBSPWM News
on:
  schedule:
    - cron: '*/30 * * * *' # Cada 30 mins
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # USAMOS FILTRO POR TEXTO EN LUGAR DE ITEM_EXEC
          filter_comments: "(?i)nebspwn"
          
          # TEMPLATE HTML
          template: "<tr><td>$date</td><td><a href='$url'>$title</a></td></tr>"
          date_format: "dd/mm/yyyy"
          
          # OPCIONAL: Configuración de commit para evitar errores de permisos
          commit_message: "Updated with the latest neBSPWM posts"
          committer_username: "blog-post-bot"
          committer_email: "blog-post-bot@example.com"
