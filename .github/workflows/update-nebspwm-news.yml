name: Update neBSPWM News
on:
  schedule:
    - cron: '*/30 * * * *' # Cada 30 mins
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # 👇 FILTRO CORREGIDO Y SIMPLIFICADO
          # 1. Junta título + descripción.
          # 2. Lo pasa a minúsculas.
          # 3. Si NO encuentra 'nebspwm', lo mata (return null).
          item_exec: |
            var text = (post.title + " " + post.description + " " + (post.content_snippet || "")).toLowerCase();
            if (text.indexOf('nebspwm') === -1) {
              return null;
            }
            return post;

          # TEMPLATE HTML
          template: "<tr><td>$date</td><td><a href='$url'>$title</a></td></tr>"
          
          date_format: "dd/mm/yyyy"