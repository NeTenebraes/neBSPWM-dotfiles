name: Update neBSPWM News
on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta una vez al día
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # Como ya filtraste en rss.app, aquí ya no necesitamos item_exec complejo.
          # Solo activamos la limpieza de HTML por si Threads manda algún residuo.
          clean_html: true
          
          # Template limpio: Fecha y Título (o Descripción) con link
          template: "<tr><td>$date</td><td><a href='$url'>$title</a></td></tr>"
          date_format: "dd/mm/yyyy"
          
          commit_message: "Bot: Update diario de neBSPWM"
          committer_username: "blog-post-bot"
          committer_email: "blog-post-bot@example.com"
