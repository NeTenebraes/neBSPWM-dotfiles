name: Update neBSPWM News
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 3
          item_exec: |
            var desc = post.description || "";
            var title = post.title || "";
            var keyword = /neBSPWM/i;
            if (desc.match(keyword) || title.match(keyword)) {
              return post;
            } else {
              return null;
            }
          template: "- $date | [$title]($url)"
          date_format: "dd/mm/yyyy"