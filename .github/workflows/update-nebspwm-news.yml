name: Update neBSPWM News
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-nebspwm:
    name: Update README with project news
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "NEBSPWM"
          feed_list: "https://rss.app/feeds/YrQvqeV8oDOWBw8C.xml"
          max_post_count: 5
          
          # 1. Limpiamos el HTML (etiquetas de imagen, divs, etc.)
          # 2. Buscamos 'bspwm' en el texto limpio
          item_exec: |
            var clean = post.description.replace(/<[^>]*>/g, '').trim();
            if (clean.toLowerCase().indexOf('bspwm') === -1) {
              return null;
            }
            post.description = clean.substring(0, 200) + '...';
            return post;

          # Usamos un template que limpie el HTML de la descripción para que no rompa tu tabla
          # La función substr ayuda a que no se rompa el diseño si el post es muy largo
          template: "<tr><td>$date</td><td><a href='$url'>$description</a></td></tr>"
          date_format: "dd/mm/yyyy"
          
          commit_message: "Bot: Noticias de neBSPWM filtradas y limpias"
          committer_username: "blog-post-bot"
          committer_email: "blog-post-bot@example.com"
